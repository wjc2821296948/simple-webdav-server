host: 0.0.0.0
port: 8080

# Inside Docker, keep this as /data and mount your storage there.
data_root: /data

users:
  display:
    root: display
    readonly: true
    quota: 5GiB
    password_hash: "$2b$12$REPLACE_ME"

  math:
    root: math
    readonly: false
    quota: 2GiB
    password_hash: "$2b$12$REPLACE_ME"

  chinese:
    root: chinese
    readonly: false
    quota: 2GiB
    password_hash: "$2b$12$REPLACE_ME"

verbose: 3

dir_browser:
  enable: true

# Basic auth is intended to run behind HTTPS.
http_authenticator:
  accept_basic: true
  accept_digest: false
  default_to_digest: false
